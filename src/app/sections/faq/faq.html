<app-section id="faq" appReveal>
  <div class="grid gap-12 lg:grid-cols-[0.9fr_1.1fr] lg:items-start">
    <div class="space-y-5">
      <p class="text-xs uppercase tracking-[0.4em] text-clay">Preguntas</p>
      <h2 class="text-4xl font-semibold text-ink md:text-5xl">Antes de escribir</h2>
    </div>

    <div class="divide-y divide-border border-y border-border">
      @for (item of items; track item.question) {
        <details class="group py-5">
          <summary
            class="flex list-none cursor-pointer items-center justify-between gap-4 text-base font-semibold text-ink"
          >
            {{ item.question }}
            <span
              class="text-xl leading-none text-ember transition-transform group-open:rotate-45"
              aria-hidden="true"
              >+</span
            >
          </summary>
          <p class="mt-3 max-w-2xl text-sm leading-7 text-muted">{{ item.answer }}</p>
        </details>
      }
    </div>
  </div>
</app-section>
